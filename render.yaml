# Tabimaru — Render Blueprint. 값은 여기에 적지 않는다(sync: false = Render 대시보드에서 직접 입력).
# 설명·기본값은 README.md의 "환경 변수" 표와 deploy/DEPLOY.md를 본다.
# 운영 서비스(japanjapantravel.onrender.com)가 대시보드에서 따로 만든 서비스라면 이 파일은 참고용 목록이다.
services:
  - type: web
    # 서비스 이름은 운영 주소·기존 서비스와 묶여 있어 이름을 바꾼 뒤에도 그대로 둔다(바꾸면 새 서비스로 만들어짐).
    name: japantravel-suite
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # ── 장소·지도 공급자 (비워 두면 free / osm: Google 호출 0회) ──
      - key: PLACES_PROVIDER
        sync: false
      - key: MAP_PROVIDER
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      # 예전 단일 키. PLACES_PROVIDER=google 이고 서버 키가 없을 때만 서버 키로 쓴다(브라우저로는 보내지 않음).
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # google 모드의 호출 상한(UTC 기준, 서버 메모리라 재시작하면 0부터 다시 셈).
      # 검색·지오코딩·경로: 하루 30 / 월 900, 사진: 하루 30 / 월 900 (비워 두면 이 기본값).
      - key: GOOGLE_DAILY_CALL_LIMIT
        sync: false
      - key: GOOGLE_MONTHLY_CALL_LIMIT
        sync: false
      - key: GOOGLE_PHOTO_DAILY_LIMIT
        sync: false
      - key: GOOGLE_PHOTO_MONTHLY_LIMIT
        sync: false
      - key: DIAGNOSTICS_TOKEN
        sync: false
      # ── AI 일정·채팅 ──
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_MODEL
        sync: false
      # 대체 모델 목록(쉼표 구분, 'none'이면 주 모델만). 비우면 서버의 실측 순서(README 표 참고).
      - key: GEMINI_FALLBACK_MODELS
        sync: false
      # 한 번 생성할 때 Gemini 모델 체인 전체가 쓸 수 있는 시간(ms). 비우면 40000.
      - key: GEMINI_TOTAL_BUDGET_MS
        sync: false
      # OpenAI 호환 공급자. Groq 무료(카드 불필요): GROQ_API_KEY=gsk_… + OPENAI_BASE_URL=https://api.groq.com/openai/v1 (README 'Groq 무료 연결')
      - key: OPENAI_BASE_URL
        sync: false
      # OpenAI 키(sk-). Groq 키는 여기가 아니라 GROQ_API_KEY에.
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # 대체 모델(쉼표 구분). 비우면 주 모델만.
      - key: OPENAI_FALLBACK_MODELS
        sync: false
      # 출력 토큰 상한(Groq 무료는 분당 8천 토큰이라 3500 권장). 비우면 상한 없음.
      - key: OPENAI_MAX_OUTPUT_TOKENS
        sync: false
      # 추론 모델의 생각 정도(reasoning.effort, Groq gpt-oss·qwen은 low 권장). 비우면 보내지 않음.
      - key: OPENAI_REASONING_EFFORT
        sync: false
      # 채팅 해석 공급자 순서(gemini,openai 기본). openai,gemini면 Groq가 먼저 해석하고 Gemini 한도는 일정에 남김.
      - key: AI_CHAT_PROVIDER_ORDER
        sync: false
      - key: AI_REQUEST_TIMEOUT_MS
        sync: false
      - key: CHAT_PARSE_STRICT_AI
        sync: false
      # ── 항공·숙소 ──
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: RAKUTEN_APP_ID
        sync: false
      - key: RAKUTEN_ACCESS_KEY
        sync: false
      # 맛집: ホットペッパー グルメサーチAPI 키(무료, 메일로 신청). 있으면 무료 모드 맛집이 도시 중심 3km 안 실제 가게가 된다.
      - key: HOTPEPPER_API_KEY
        sync: false
      # ── 환율 고정값(실시간 조회가 실패할 때만) ──
      - key: FX_USD_KRW
        sync: false
      - key: FX_JPY_KRW
        sync: false
      # ── 로그인·세션·보안 ──
      # 32자 이상 무작위 값(더 약하면 서버가 쓰지 않음). 만들기: node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      - key: SESSION_SECRET
        sync: false
      # 로그인할 수 있는 계정(쉼표 구분: u_…·google:<id>·확인된 이메일). 비우면 누구나. 혼자 쓰면 설정 권장.
      - key: ALLOWED_LOGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OAUTH_BASE_URL
        sync: false
      # Render에서는 RENDER 변수가 있어 프록시를 자동으로 믿는다. TRUST_PROXY_HOPS는 배포 로그의 [proxy] 분포 줄을 본 뒤에만 바꾼다(deploy/DEPLOY.md "1) 배포 직후 확인"의 1번).
      - key: TRUST_PROXY
        sync: false
      - key: TRUST_PROXY_HOPS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      # ── 일정 저장소(Supabase, 선택) ──
      # 설정하면 "내 일정"이 Supabase에 남는다(Render 재시작·재배포에도). 키는 sb_secret_…(새 형식) 또는 service_role(eyJ…).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 로컬 파일 저장 폴더(절대 경로). Render 무료 플랜은 디스크가 재시작 때 지워지므로 보통 비워 둔다.
      - key: TABIMARU_DATA_DIR
        sync: false
