name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 외부 패키지가 없어 npm install은 필요 없다.
      # 테스트는 키를 모두 비우고 가짜 벤더 서버(포트 3205)만 쓴다 — 실제 외부 API를 부르지 않는다.
      - name: Test
        run: npm test
